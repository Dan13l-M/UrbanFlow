<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanFlow — Reportes</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="uf-header">
    <div class="uf-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
      UrbanFlow
    </div>
    <nav class="uf-nav">
      <a href="/index.html">Dashboard</a>
      <a href="/admin.html">Administración</a>
      <a href="/reports.html" class="active">Reportes</a>
    </nav>
    <span style="color:var(--text-muted);font-size:12px;">Reportes</span>
  </header>

  <main class="reports-main">

    <!-- Filtros de reporte -->
    <div class="reports-filters">
      <div class="form-group" style="margin:0">
        <label style="font-size:12px;color:var(--text-muted)">Repartidor</label>
        <select class="filter-select" id="rep-driver" style="min-width:160px">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="form-group" style="margin:0">
        <label style="font-size:12px;color:var(--text-muted)">Desde</label>
        <input type="date" class="filter-select" id="rep-from">
      </div>
      <div class="form-group" style="margin:0">
        <label style="font-size:12px;color:var(--text-muted)">Hasta</label>
        <input type="date" class="filter-select" id="rep-to">
      </div>
      <button class="btn btn-primary" onclick="loadReports()">Aplicar</button>
      <button class="btn btn-ghost" onclick="exportCSV()">↓ Exportar CSV</button>
    </div>

    <!-- Gráficas -->
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Cumplimiento ETA por Repartidor</div>
        <div class="chart-container">
          <canvas id="chart-eta"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Volumen de Entregas por Día</div>
        <div class="chart-container">
          <canvas id="chart-volume"></canvas>
        </div>
      </div>
    </div>

    <!-- Tabla de productividad -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Repartidor</th>
            <th>Total Pedidos</th>
            <th>Entregados</th>
            <th>Cumplimiento</th>
            <th>ETA Promedio</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody id="report-tbody">
          <tr><td colspan="6" style="color:var(--text-muted);text-align:center;padding:20px">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="/js/reports.js"></script>
</body>
</html>
